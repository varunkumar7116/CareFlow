server:
  port: 8081

spring:
  datasource:
    url: jdbc:h2:mem:careflow_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: sa
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.amqp.RabbitAutoConfiguration

jwt:
  secret: careflowSuperSecretKeyForDevelopmentPhaseProductionReady2026!
  expiration-ms: 86400000
