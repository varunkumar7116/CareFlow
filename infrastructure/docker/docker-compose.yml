version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: careflow-postgres
    environment:
      POSTGRES_DB: careflow_db
      POSTGRES_USER: careflow_user
      POSTGRES_PASSWORD: careflow_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/init.sql

  redis:
    image: redis:7-alpine
    container_name: careflow-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: careflow-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: careflow_mq
      RABBITMQ_DEFAULT_PASS: careflow_mq_pass
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data:
